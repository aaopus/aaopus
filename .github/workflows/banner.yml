# Baut das Profilbanner einmal am Tag aus GitHubs öffentlichem Beitragskalender neu.
# Keine Secrets, keine Fremdpakete. Einzige Berechtigung: Inhalte dieses Repos schreiben
# (genutzt nur fuer banner-dark.svg und banner-light.svg).
name: Banner aktualisieren

on:
  schedule:
    - cron: "17 3 * * *"   # täglich ca. 04:17 Uhr deutscher Winterzeit
  workflow_dispatch:        # zusätzlich per Knopf unter "Actions" startbar

permissions:
  contents: write

concurrency:
  group: banner
  cancel-in-progress: false

jobs:
  banner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repo holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}   # neuesten Stand holen, falls zwei Laeufe kurz nacheinander starten

      - name: Banner bauen
        env:
          GH_USER: ${{ github.repository_owner }}
        run: python3 -I banner.py "$GH_USER"

      - name: Nur bei Änderung speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add banner-dark.svg banner-light.svg
          if git diff --cached --quiet; then
            echo "Keine Änderung"
          else
            git commit -m "Banner aktualisiert"
            git push
          fi
